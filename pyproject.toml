[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oswap-ai-demonstrator"
version = "0.4.0"
description = "OSWAP AI Demonstrator: a portable, backend-agnostic local-first AI research framework with hybrid RAG, provenance-aware assessments, and portable text exports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "ollama==0.6.2",
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
]

[project.scripts]
oswap-ai-demonstrator = "app.main:main"

[project.urls]
Homepage = "https://github.com/GremlinNavi/oswap-ai-demonstrator"
Source = "https://github.com/GremlinNavi/oswap-ai-demonstrator"
Issues = "https://github.com/GremlinNavi/oswap-ai-demonstrator/issues"
Security = "https://github.com/GremlinNavi/oswap-ai-demonstrator/security/advisories"

[project.optional-dependencies]
test = ["pytest==9.1.1"]
