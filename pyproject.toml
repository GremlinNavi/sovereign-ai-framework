[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eternal-thread"
version = "0.4.0rc4"
description = "Sovereign AI Demonstrator (Eternal Thread): a portable, backend-agnostic local-first AI research framework with hybrid RAG, provenance-aware assessments, and portable text exports."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
ollama = ["ollama==0.6.2"]
test = ["pytest==9.1.1"]
