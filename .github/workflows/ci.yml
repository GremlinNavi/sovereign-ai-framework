name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a Signed-off-by trailer on every pull request commit
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <.+>$'; then
              echo "Commit $commit is missing a DCO Signed-off-by trailer."
              missing=1
            fi
          done < <(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          test "$missing" -eq 0

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Keep CI-created application data outside the source checkout and runner profile.
      ETERNAL_THREAD_DATA_DIR: ${{ runner.temp }}/eternal-thread-data
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.lock

      - name: Compile sources
        run: python -m compileall -q app tests config.py launcher.py

      - name: Validate configuration
        run: python config.py --validate

      - name: Run tests
        run: python -m pytest -q
